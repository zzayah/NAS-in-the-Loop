data:
  train_path: safety-nas/datasets/combined_all.npz
  target_col: track_width
  batch_size: 128
  num_workers: 8
  val_split: 0.1
  pin_memory: true
  prefetch_factor: 2
training:
  seed: 0
  max_epochs: 150
  lr: 0.001
  weight_decay: 1.0e-05
  early_stopping_patience: 15
  lr_patience: 10
  lr_scheduler_factor: 0.5
  optimizer: adamw
  scheduler: reduce_on_plateau
  auto_lr_find: false
  resume: false
  precision: '32'
  gradient_clip_val: 1.0
  profiler: null
model:
  arch_id: 7
  dynamic:
    in_channels: 1
    input_length: 1080
    activation: elu
    conv_layers:
    - out_channels: 1
      kernel_size: 3
      stride: 1
      padding: 0
      pool_size: 4
    - out_channels: 24
      kernel_size: 3
      stride: 1
      padding: 0
      pool_size: 4
    fc_layers:
    - 128
    - 64
artifacts:
  model_dir: /home/zayah/NAS-in-the-Loop/data/safety-nas/safety-nas-seed-0/yas-marina/test-best/hgu3wm16/track_width/models
  checkpoint_dir: /home/zayah/NAS-in-the-Loop/data/safety-nas/safety-nas-seed-0/yas-marina/test-best/hgu3wm16/track_width/checkpoints
  log_dir: /home/zayah/NAS-in-the-Loop/data/safety-nas/safety-nas-seed-0/yas-marina/test-best/hgu3wm16/track_width/lightning_logs
